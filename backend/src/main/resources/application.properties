spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ordercraft}
spring.datasource.username=${DB_USER:ordercraft}
spring.datasource.password=${DB_PASSWORD:ordercraft_local}
spring.sql.init.mode=never
spring.flyway.baseline-on-migrate=${BASELINE_EXISTING_DATABASE:false}
spring.flyway.baseline-version=1
server.error.include-message=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
ordercraft.admin.username=${ADMIN_USERNAME:admin}
ordercraft.admin.password=${ADMIN_PASSWORD:}
server.port=8080
